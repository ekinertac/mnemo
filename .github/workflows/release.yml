name: Release

# Cut a release by pushing a tag: `git tag v0.2.0 && git push origin v0.2.0`.
# Requires a repo secret HOMEBREW_TAP_TOKEN — a PAT with `contents:write` on ekinertac/homebrew-tap —
# so GoReleaser can push the updated formula there. The GITHUB_TOKEN only covers this repo.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
